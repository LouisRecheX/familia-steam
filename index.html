<script>
const MEMBERS=[["Marllon","#f5c518","Amarelo"],["Keren","#f472b6","Rosa"],["Borges","#1c1d22","Preto"],["Jonathan","#e5383b","Vermelho"],["Gilney","#2fbf71","Verde"],["Luiz","#3b82f6","Azul"]];
const HP=["M16 3C9 3 5 8 5 15v9c0 2 1 4 3 4h16c2 0 3-2 3-4v-9C27 8 23 3 16 3z","M8 13h16c1 0 1.5 1 1.2 2.2C24.5 17.5 21 19 16 19s-8.5-1.5-9.2-3.8C6.5 14 7 13 8 13z"];
function helmet(c,sz){return `<svg class="hm" viewBox="0 0 32 32" width="${sz}" height="${sz}" aria-hidden="true"><path d="${HP[0]}" fill="${c}" stroke="rgba(255,255,255,.45)"/><path d="${HP[1]}" fill="#0b0c10" stroke="rgba(255,255,255,.25)" stroke-width=".8"/></svg>`}
function drawHelmet(x,c,px,py,sz){x.save();x.translate(px,py);x.scale(sz/32,sz/32);x.fillStyle=c;x.fill(new Path2D(HP[0]));x.strokeStyle="rgba(255,255,255,.45)";x.lineWidth=1;x.stroke(new Path2D(HP[0]));x.fillStyle="#0b0c10";x.fill(new Path2D(HP[1]));x.strokeStyle="rgba(255,255,255,.25)";x.lineWidth=.8;x.stroke(new Path2D(HP[1]));x.restore()}
const SUPABASE_URL="https://viawxlfqhjqgglqrqjdd.supabase.co",SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpYXd4bGZxaGpxZ2dscXJxamRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzMjA2OTAsImV4cCI6MjEwNjg5NjY5MH0.n2Iz2vQoJdpw6sS9d14vTUYgWgN_jUMAZ4NrxjToQg0";
const EMAIL_DOMAIN="familiasteam.app";
const CONFIGURED=/^https?:/.test(SUPABASE_URL);
const sb=CONFIGURED?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
let games=[],props=[],wish=[],budgets={},me=null;
const isAdmin=()=>!!me&&me.role==="admin";
const mi=n=>MEMBERS.findIndex(m=>m[0]===n);
const snap=new Map();
async function loadAll(){
  const [g,w,p,pr]=await Promise.all([
    sb.from("games").select("*,participants(member,paid)").order("created_at",{ascending:false}),
    sb.from("wishlist").select("*").order("created_at",{ascending:false}),
    sb.from("proposals").select("*,votes(member,accept)").order("created_at",{ascending:false}),
    sb.from("profiles").select("name,role,monthly_budget")]);
  const er=g.error||w.error||p.error||pr.error;
  if(er){toast("Erro ao carregar os dados: "+er.message);return}
  games=g.data.map(r=>{const ps=r.participants.slice().sort((a,b)=>mi(a.member)-mi(b.member));
    return{id:r.id,name:r.name,total:+r.total,parcelas:r.parcelas,start:r.start_date||undefined,year:r.year||+(r.start_date||"").slice(0,4)||new Date().getFullYear(),img:r.img||undefined,members:ps.map(x=>x.member),pay:Object.fromEntries(ps.map(x=>[x.member,x.paid]))}});
  snap.clear();games.forEach(x=>snap.set(x.id,JSON.stringify(x)));
  wish=w.data;props=p.data;budgets={};pr.data.forEach(x=>{budgets[x.name]=x.monthly_budget});
  render();wishRender();voteRender();
}
function save(){if(!isAdmin())return;save.p=(save.p||Promise.resolve()).then(syncGames)}
async function syncGames(){
  try{
    for(const g of games){const s=JSON.stringify(g);if(snap.get(g.id)===s)continue;
      let r=await sb.from("games").upsert({id:g.id,name:g.name,total:g.total,parcelas:g.parcelas,start_date:g.start||null,year:g.year,img:g.img||null});if(r.error)throw r.error;
      r=await sb.from("participants").upsert(g.members.map(m=>({game_id:g.id,member:m,paid:g.pay[m]||0})));if(r.error)throw r.error;
      snap.set(g.id,s)}
    const ids=new Set(games.map(g=>g.id));
    for(const id of [...snap.keys()])if(!ids.has(id)){const r=await sb.from("games").delete().eq("id",id);if(r.error)throw r.error;snap.delete(id)}
  }catch(e){toast("Não foi possível salvar: "+(e.message||e))}
}
const $=id=>document.getElementById(id);
const brl=n=>n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const color=name=>(MEMBERS.find(m=>m[0]===name)||[0,"#8f96c9"])[1];

function schedLine(g){

    <button data-a="photo" data-id="${g.id}">${g.img?"Trocar foto":"Anexar foto"}</button>${g.img?`<button data-a="rmphoto" data-id="${g.id}">Remover foto</button>`:""}

function place(){

    el.style.opacity=a>2?0:1-a*.25;el.style.zIndex=10-Math.round(a);el.style.pointerEvents=a>2?"none":"auto";el.classList.toggle("on",o===0)});

  games.forEach(g=>yrs.add(g.year));
  if(!yrs.has(cy))cy=now;
  const tot={};MEMBERS.forEach(([n])=>tot[n]=0);
  games.forEach(g=>{if(g.year!==cy)return;const per=g.total/g.members.length/g.parcelas;g.members.forEach(m=>{tot[m]+=per*Math.min(pg(g,m),g.parcelas)})});
  const sum=Object.values(tot).reduce((a,b)=>a+b,0),mx=Math.max(...Object.values(tot),0.01);
  $("ct").innerHTML=`<h2>Contribuído em <select id="cy" aria-label="Ano">${[...yrs].sort().map(y=>`<option ${y===cy?"selected":""}>${y}</option>`).join("")}</select></h2>
  ${MEMBERS.map(([n,c])=>`<div class="cr"><span>${helmet(c,18)}${n}</span><div class="cb"><i style="width:${tot[n]/mx*100}%"></i></div><b>${brl(tot[n])}</b></div>`).join("")}
  <div class="cs"><span>Total do ano</span><b>${brl(sum)}</b></div>
  <p class="ch">Soma do que já foi pago dos jogos adicionados em ${cy}.</p>`;
}
$("ct").addEventListener("change",e=>{if(e.target.id==="cy"){cy=+e.target.value;contribRender()}});
$("list").addEventListener("toggle",e=>{const d=e.target;if(d.classList&&d.classList.contains("pay")){const id=+d.dataset.id;d.open?openSet.add(id):openSet.delete(id)}},true);
function onAct(e){
  const b=e.target.closest("button[data-a]");if(!b)return;
  const g=games.find(x=>x.id==b.dataset.id);if(!g)return;
  const a=b.dataset.a,m=b.dataset.m;
  if(a==="inc"&&pg(g,m)<g.parcelas)g.pay[m]=pg(g,m)+1;
  else if(a==="dec"&&pg(g,m)>0)g.pay[m]=pg(g,m)-1;
  else if(a==="full")g.pay[m]=g.parcelas;
  else if(a==="all")g.members.forEach(x=>{if(pg(g,x)<g.parcelas)g.pay[x]=pg(g,x)+1});
  else if(a==="photo"){photoId=g.id;$("fp").click();return}
  else if(a==="rmphoto"){delete g.img}
  else if(a==="reopen"){g.members.forEach(x=>{g.pay[x]=Math.max(0,pg(g,x)-1)})}
  else if(a==="rep"){openReport(g);return}
  else if(a==="del"){pendingDel=g.id;render();return}
  else if(a==="delno"){pendingDel=null;render();return}
  else if(a==="delyes"){pendingDel=null;games=games.filter(x=>x!==g)}
  save();render();
}
$("fin").addEventListener("click",navClick);
$("fin").addEventListener("click",onAct);
$("list").addEventListener("click",onAct);

$("list").addEventListener("change",e=>{const i=e.target;if(i.classList&&i.classList.contains("sd")&&i.value){const g=games.find(x=>x.id==i.dataset.id);if(g){g.start=i.value;save();render()}}});
/* ---------- Relatório ---------- */
let cur=null;
function fit(x,t,w){while(t.length>3&&x.measureText(t).width>w)t=t.slice(0,-2);return t}
function drawReport(g){
  const W=900,S=2,n=g.members.length,RH=58;
  const F=(w,s)=>`${w} ${s}px 'Space Grotesk','Segoe UI',Arial,sans-serif`;
  const share=g.total/n,per=share/g.parcelas;
  const items=g.start?Array.from({length:g.parcelas},(_,k)=>`${k+1}ª ${fmt(due(g,k))}`):[];
  const mc=document.createElement("canvas").getContext("2d");mc.font=F(400,14);
  const lines=[];let ln="";
  items.forEach(t=>{const nx=ln?ln+"   ·   "+t:t;if(mc.measureText(nx).width>820&&ln){lines.push(ln);ln=t}else ln=nx});
  if(ln)lines.push(ln);
  const H=215+n*RH+190+(lines.length?lines.length*24+56:0);
  const c=document.createElement("canvas");c.width=W*S;c.height=H*S;
  const x=c.getContext("2d");x.scale(S,S);
  x.fillStyle="#0d0e12";x.fillRect(0,0,W,H);
  x.fillStyle="#2a2c33";x.fillRect(0,0,W,2);
  x.fillStyle="#9a9ea9";x.font=F(500,16);x.fillText("Família Steam · Relatório de pagamentos",40,50);
  x.fillStyle="#f2f3f5";x.font=F(700,34);x.fillText(fit(x,g.name,820),40,98);
  x.fillStyle="#9a9ea9";x.font=F(400,16);
  x.fillText(`Total ${brl(g.total)}  ·  ${g.parcelas}x de ${brl(g.total/g.parcelas)}  ·  ${n} participante(s)  ·  gerado em ${new Date().toLocaleDateString("pt-BR")}`,40,132);
  if(g.start)x.fillText(`1ª parcela em ${fmt(due(g,0))}  ·  última em ${fmt(due(g,g.parcelas-1))}`,40,158);
  let y=198;
  x.font=F(500,14);x.fillStyle="#9a9ea9";
  x.fillText("Membro",98,y);x.textAlign="right";
  x.fillText("Parcelas",430,y);x.fillText("Já pagou",590,y);x.fillText("Falta pagar",740,y);x.fillText("Situação",860,y);x.textAlign="left";
  y+=14;let tp=0,tf=0;
  g.members.forEach((m,i)=>{
    const p=pg(g,m),paid=per*p,left=per*(g.parcelas-p);tp+=paid;tf+=left;
    x.fillStyle=i%2?"#15161b":"#1a1b21";x.fillRect(40,y,820,RH-4);
    drawHelmet(x,color(m),52,y+9,34);
    x.fillStyle="#f2f3f5";x.font=F(700,19);x.fillText(m,98,y+27);
    if(g.start){x.fillStyle="#9a9ea9";x.font=F(400,12);x.fillText(p<g.parcelas?`próx. vencimento ${fmt(due(g,p))} (${p+1}ª)`:"todas as parcelas pagas",98,y+44)}
    x.font=F(500,17);x.textAlign="right";
    x.fillStyle="#f2f3f5";x.fillText(`${p}/${g.parcelas}`,430,y+33);
    x.fillStyle="#4ade80";x.fillText(brl(paid),590,y+33);
    x.fillStyle=left>0.004?"#ff7a7a":"#4ade80";x.font=F(700,18);x.fillText(brl(left),740,y+33);
    x.fillStyle=left>0.004?"#9a9ea9":"#4ade80";x.font=F(500,15);x.fillText(left>0.004?"Em aberto":"Quitado",860,y+33);
    x.textAlign="left";y+=RH;
  });
  y+=10;x.fillStyle="#2a2c33";x.fillRect(40,y,820,2);y+=36;
  x.fillStyle="#9a9ea9";x.font=F(500,16);x.fillText("Valor de cada um no total",40,y);
  x.textAlign="right";x.fillStyle="#f2f3f5";x.font=F(700,18);x.fillText(`${brl(share)}  (${g.parcelas}x de ${brl(per)})`,860,y);x.textAlign="left";
  y+=34;x.fillStyle="#9a9ea9";x.font=F(500,16);x.fillText("Total já pago",40,y);
  x.textAlign="right";x.fillStyle="#4ade80";x.font=F(700,20);x.fillText(brl(tp),860,y);x.textAlign="left";
  y+=34;x.fillStyle="#9a9ea9";x.font=F(500,16);x.fillText("Total que falta",40,y);
  x.textAlign="right";x.fillStyle=tf>0.004?"#ff7a7a":"#4ade80";x.font=F(700,20);x.fillText(brl(tf),860,y);x.textAlign="left";
  if(lines.length){
    y+=46;x.fillStyle="#f2f3f5";x.font=F(700,16);x.fillText("Calendário das parcelas",40,y);
    x.fillStyle="#9a9ea9";x.font=F(400,14);
    lines.forEach(l=>{y+=24;x.fillText(l,40,y)});
  }
  return c;
}
function pdfFrom(c){
  const jpg=Uint8Array.from(atob(c.toDataURL("image/jpeg",.92).split(",")[1]),ch=>ch.charCodeAt(0));
  const w=c.width/2,h=c.height/2,enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const add=d=>{const b=typeof d==="string"?enc.encode(d):d;parts.push(b);len+=b.length};
  const obj=(k,body)=>{offs[k]=len;add(`${k} 0 obj\n${body}\nendobj\n`)};
  add("%PDF-1.4\n");
  obj(1,"<</Type/Catalog/Pages 2 0 R>>");
  obj(2,"<</Type/Pages/Kids[3 0 R]/Count 1>>");
  obj(3,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${w} ${h}]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>`);
  offs[4]=len;add(`4 0 obj\n<</Type/XObject/Subtype/Image/Width ${c.width}/Height ${c.height}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpg.length}>>\nstream\n`);add(jpg);add("\nendstream\nendobj\n");
  const cs=`q ${w} 0 0 ${h} 0 0 cm /Im0 Do Q`;
  obj(5,`<</Length ${cs.length}>>\nstream\n${cs}\nendstream`);
  const xr=len;
  add("xref\n0 6\n0000000000 65535 f \n"+[1,2,3,4,5].map(k=>String(offs[k]).padStart(10,"0")+" 00000 n \n").join(""));
  add(`trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(parts,{type:"application/pdf"});
}
function note(t){$("rn").textContent=t}
function openReport(g){
  cur={g,c:drawReport(g)};
  $("rc").innerHTML="";cur.c.style.cssText="width:100%;height:auto;border-radius:8px;display:block";$("rc").appendChild(cur.c);
  note("");$("md").hidden=false;$("rclose").focus();
}
function showImg(){
  if(!cur)return;
  const im=new Image();im.alt="Relatório do jogo";im.src=cur.c.toDataURL("image/png");
  im.style.cssText="width:100%;height:auto;border-radius:8px;display:block";
  $("rc").innerHTML="";$("rc").appendChild(im);
}
const MSG={extension_not_enabled:"Este formato está desativado nesta visualização.",too_large:"Arquivo grande demais.",rate_limited:"Aguarde um instante e tente de novo.",rejected_extension:"Formato de arquivo não aceito."};
function saveFile(name,data){const u=URL.createObjectURL(data),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);note("")}
$("rpng").onclick=()=>{if(!cur)return;cur.c.toBlob(b=>{if(!b){note("Não foi possível gerar a imagem.");return}saveFile(`relatorio-${slug(cur.g.name)}.png`,b)},"image/png")};
$("rpdf").onclick=()=>{if(!cur)return;let b;try{b=pdfFrom(cur.c)}catch(e){note("Não foi possível gerar o PDF ("+(e&&e.message||"erro")+").");return}saveFile(`relatorio-${slug(cur.g.name)}.pdf`,b)};
$("rclose").onclick=()=>{$("md").hidden=true};
$("md").addEventListener("click",e=>{if(e.target===$("md"))$("md").hidden=true});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("md").hidden=true});
$("d").value=today();
async function enter(session){
  const {data,error}=await sb.from("profiles").select("*").eq("id",session.user.id).single();
  if(error||!data){await sb.auth.signOut();$("le").textContent="Perfil não encontrado. Fale com o administrador.";return}
  me=data;document.body.classList.toggle("member",!isAdmin());
  $("lg").hidden=true;$("app").hidden=false;
  $("who").textContent=`${me.name} · ${isAdmin()?"administrador":"membro"}`;
  await loadAll();
}
$("lf").addEventListener("submit",async e=>{
  e.preventDefault();$("le").textContent="";
  if(!sb){$("le").textContent="Falta configurar a URL e a chave do Supabase no início do index.html.";return}
  const u=$("lu").value.trim().toLowerCase();
  const {data,error}=await sb.auth.signInWithPassword({email:`${u}@${EMAIL_DOMAIN}`,password:$("lp").value});
  if(error){$("le").textContent="Usuário ou senha incorretos.";return}
  await enter(data.session);
});
$("out").onclick=async()=>{await sb.auth.signOut();location.reload()};
if(sb)sb.auth.getSession().then(({data})=>{if(data.session)enter(data.session)});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&me&&!$("md").hidden===false)loadAll()});
